<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Ideator Labs</title>
<desc id="d">A studio at the intersection of AI and data advisory, innovation and business intelligence.</desc>
<defs>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F9FE"/><stop offset="1" stop-color="#E8F0FB"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B6FE0"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
  <linearGradient id="barg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3B6FE0"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
  <linearGradient id="hexfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF5FE"/></linearGradient>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#D3E0F3"/></pattern>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3B6FE0" flood-opacity=".10"/></filter>
  <clipPath id="clip"><rect width="1280" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1280" height="320" fill="url(#wash)"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity=".7"/>
  <!-- orbits, right -->
  <circle cx="1112" cy="160" r="106" fill="none" stroke="#B9CDEE" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="1112" cy="160" r="138" fill="none" stroke="#D3E0F3" stroke-width="1"/>
  <circle cx="1112" cy="22" r="4" fill="#3B6FE0"/>
  <circle cx="1250" cy="160" r="3" fill="#22B8CF"/>
  <circle cx="1037" cy="85" r="3" fill="#3B6FE0" opacity=".7"/>
  <!-- small insight card -->
  <rect x="1048" y="104" width="128" height="112" rx="14" fill="#FFFFFF" stroke="#D9E5F5" filter="url(#lift)"/>
  <rect x="1066" y="122" width="44" height="6" rx="3" fill="#E6EEF9"/>
  <circle cx="1158" cy="125" r="3.5" fill="#22B8CF"/>
  <rect x="1072" y="166" width="16" height="32" rx="8" fill="url(#barg)"/>
  <rect x="1104" y="146" width="16" height="52" rx="8" fill="url(#barg)"/>
  <rect x="1136" y="156" width="16" height="42" rx="8" fill="url(#barg)"/>
  <!-- mark card -->
  <rect x="88" y="88" width="144" height="144" rx="24" fill="url(#hexfill)" stroke="#D9E5F5" filter="url(#lift)"/>
  <g transform="translate(102.4 102.4) scale(3.6)"><path d="M16 2.2 27.9 9.1v13.8L16 29.8 4.1 22.9V9.1z" fill="none" stroke="#14161B" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 15.2 16 9.4l5 3.8z" fill="none" stroke="#14161B" stroke-width="0.9" stroke-linejoin="round" opacity="0.55"/><rect x="9.5" y="17" width="3" height="6.4" rx="1.5" fill="#14161B"/><rect x="14.5" y="12.4" width="3" height="11" rx="1.5" fill="#14161B"/><rect x="19.5" y="15" width="3" height="8.4" rx="1.5" fill="#14161B"/><circle cx="11" cy="15.2" r="1.5" fill="#14161B"/><circle cx="16" cy="9.4" r="1.9" fill="#14161B"/><circle cx="21" cy="13.2" r="1.5" fill="#14161B"/></g>
  <!-- words -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="276" y="140" font-size="62" font-weight="700" letter-spacing="-1.2" fill="#0f172a">Ideator Labs</text>
    <rect x="278" y="160" width="64" height="4" rx="2" fill="url(#brand)"/>
    <text x="276" y="202" font-size="24" fill="#475569">A studio at the intersection of AI and data advisory,</text>
    <text x="276" y="234" font-size="24" fill="#475569">innovation and business intelligence.</text>
  </g>
</g>
</svg>
